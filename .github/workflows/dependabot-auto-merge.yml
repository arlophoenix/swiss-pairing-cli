name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # These runs read Dependabot secrets, not Actions secrets, so both values
      # must be set in both places.
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Every update type qualifies, majors included. The required status checks
      # on main are the gate: a PR that fails them stays open.
      #
      # Enabled with the App token because a merge enabled by GITHUB_TOKEN does
      # not trigger workflows, so main would get no CI run and no Release.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
